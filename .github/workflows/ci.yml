name: CI - Docker Compose

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Intentional research-demo fault: this manifest is absent from the
      # repository so the pipeline produces a deterministic deployment-
      # configuration failure for prediction and XAI diagnosis.
      - name: Validate production deployment configuration
        run: docker compose -f docker-compose.production.yml config

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend health endpoint
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          curl -fsS http://localhost:5000/health > /dev/null

      - name: Check frontend
        run: curl -fsS http://localhost:3000 > /dev/null

      - name: Show logs if failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
